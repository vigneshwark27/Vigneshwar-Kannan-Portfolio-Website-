function statusPill(c,text){return `<span class="status ${statClass(c)}"><span class="dot"></span>${text}</span>`}
function dashboard(){return `<div class="page-head"><div><div class="title">Hospital Command Center</div><div class="subtitle">Operational overview • insurance discharge workflow is the active prototype</div></div><button class="btn btn-primary" onclick="setView('insurance')">Open Insurance Module</button></div>
<div class="demo-banner">◆ <strong>Prototype scope:</strong> Non-insurance modules are static context. Insurance is the working product flow.</div>
<div class="grid kpis"><div class="card kpi"><div class="label">Inpatients</div><div class="value">128</div><div class="hint">6 ready for discharge</div></div><div class="card kpi"><div class="label">Discharge-critical claims</div><div class="value">3</div><div class="hint">1 approaching TAT</div></div><div class="card kpi"><div class="label">TAT breached</div><div class="value">2</div><div class="hint">Needs operations follow-up</div></div><div class="card kpi"><div class="label">Insurance authorization</div><div class="value">2.4h</div><div class="hint">Average final-stage time</div></div></div>
<div class="grid feature-grid"><div class="card feature-card"><div class="feature-tag">Existing</div><h3>EMR</h3><p>Patient records, diagnosis, procedures, discharge documentation and clinical history feed the insurance workflow.</p></div><div class="card feature-card"><div class="feature-tag">Existing</div><h3>Billing</h3><p>Final bill, payer split and patient payable amount are linked to the same inpatient episode.</p></div><div class="card feature-card"><div class="feature-tag">Working prototype</div><h3>Insurance</h3><p>Claim readiness, discharge control tower, query/assignment, TAT and patient communication.</p><button class="btn btn-secondary" style="margin-top:12px" onclick="setView('insurance')">Go to Insurance →</button></div></div>`}
function staticView(name){const map={patients:['Patients','Patient registration, demographics and inpatient records.'],emr:['Electronic Medical Records','Clinical notes, diagnosis, procedures, investigations and discharge summaries.'],beds:['Admissions & Beds','Admission, transfer, bed allocation and discharge operations.'],billing:['Billing','Inpatient billing, payer splits, co-pay and settlement.'],pharmacy:['Pharmacy','Medication orders, dispensing and stock.'],lab:['Laboratory','Investigation orders, results and reports.'],reports:['Reports','Hospital operational and financial analytics.'],settings:['Settings','Payer configuration, user roles and hospital preferences.']};const [t,d]=map[name];return `<div class="page-head"><div><div class="title">${t}</div><div class="subtitle">${d}</div></div></div><div class="card empty"><strong>Static prototype context</strong><div style="margin-top:8px">This module is intentionally not interactive. The working product is the Insurance discharge workflow.</div></div>`}
function renderJourney(){const readiness=state.readinessRun;const blocked=!readiness;const queryClaim=state.claims.find(x=>x.query);return `<div class="journey-head"><div><div class="small">END-TO-END DISCHARGE JOURNEY</div><div class="journey-title">Medically ready → insurance authorization → discharge</div><div class="journey-sub">This mirrors the future-state process. Select a claim from the Control Tower when you need to inspect a specific patient.</div></div><div class="journey-context"><span class="badge">Patient-level claim data</span><span class="badge">Status + ownership + TAT</span></div></div><div class="journey-rail"><div class="journey-step"><div class="journey-node active">1</div><div class="journey-content main" onclick="openClaimPrep()"><div class="journey-label">Medically Ready for Discharge</div><div class="journey-meta">Doctor clears the patient • insurance discharge workflow begins</div></div><div class="journey-arrow">›</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node active">2</div><div class="journey-content main" onclick="openClaimPrep()"><div class="journey-label">Claim Preparation</div><div class="journey-meta">Fetch existing EMR + Billing + Insurance records and assemble the claim package</div></div><div class="journey-arrow">›</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node ${blocked?'warn':'done'}">3</div><div class="journey-content main" onclick="openClaimPrep()"><div class="journey-label">Claim Readiness</div><div class="journey-meta">Validate documents, payer requirements and cross-record consistency</div><div class="flow-mini"><span class="mini-label"><strong>${blocked?'Not ready':'Ready'}</strong></span><span class="mini-label">Rules + AI-assisted validation</span></div></div><div class="journey-arrow">›</div></div><div class="journey-branch"><div class="branch bad" onclick="openClaimPrep()"><strong>NOT READY</strong><br/>Resolve blockers → re-check</div><div class="branch good" onclick="openClaimPrep()"><strong>READY</strong><br/>Submit final claim</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node active">4</div><div class="journey-content main" onclick="monitorClaims()"><div class="journey-label">Insurance Claim Control Tower</div><div class="journey-meta">Monitor status • owner • reason • TAT • queries • escalation</div></div><div class="journey-arrow">›</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node active">5</div><div class="journey-content main" onclick="monitorClaims()"><div class="journey-label">TPA / Insurer Review</div><div class="journey-meta">Payer-side progress is visible through system events and verified manual updates</div></div><div class="journey-arrow">›</div></div><div class="journey-branch"><div class="branch bad" onclick="${queryClaim?`openClaimTab('${queryClaim.id}','query')`:'monitorClaims()'}"><strong>QUERY RAISED</strong><br/>Insurance Desk → manual assignment → response → TPA re-review</div><div class="branch good" onclick="monitorClaims()"><strong>CONTINUE REVIEW</strong><br/>Move toward final authorization</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node active">6</div><div class="journey-content main" onclick="monitorClaims()"><div class="journey-label">Final Authorization</div><div class="journey-meta">Authorization received / pending • move to billing clearance</div></div><div class="journey-arrow">›</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node active">7</div><div class="journey-content main" onclick="monitorClaims()"><div class="journey-label">Billing Clearance</div><div class="journey-meta">Reconcile final bill against approved insurance amount</div></div><div class="journey-arrow">›</div></div><div class="journey-connector"></div><div class="journey-step"><div class="journey-node done">8</div><div class="journey-content main" onclick="monitorClaims()"><div class="journey-label">Discharge</div><div class="journey-meta">Billing cleared → final discharge formalities → patient exits</div></div><div class="journey-arrow">›</div></div></div><div class="journey-note"><span><strong>Patient Communication:</strong> patient-specific updates are managed from the Patient Communication list.</span><button class="btn btn-secondary" onclick="openPatientCommunicationList()">Open Patient Communication</button></div>`}
function insurance(){const c=state.claims;const openQueryCount=c.filter(x=>x.query && x.query.status!=='Response Submitted').length;const atRisk=c.filter(x=>x.health!=='green').length;const hospitalActions=c.filter(x=>x.query && x.owner!=='TPA').length;return `<div class="page-head"><div><div class="title">Insurance & Cashless Discharge</div><div class="subtitle">Discharge-critical claims • prevent, monitor and resolve avoidable authorization delays</div></div><div style="display:flex;gap:8px"><button class="btn btn-secondary" onclick="openClaimPrep()">+ Prepare Discharge Claim</button><button class="btn btn-primary" onclick="monitorClaims()">View Control Tower</button></div></div>
<div class="card section journey-wrap">${renderJourney()}</div>
<div class="grid kpis"><div class="card kpi"><div class="label">Discharge-critical</div><div class="value">${c.length}</div><div class="hint">Medically ready + insurance pending</div></div><div class="card kpi"><div class="label">Needs attention</div><div class="value">${atRisk}</div><div class="hint">Approaching / breached TAT</div></div><div class="card kpi"><div class="label">Hospital actions</div><div class="value">${hospitalActions}</div><div class="hint">Assigned by Insurance Operations</div></div><div class="card kpi"><div class="label">Patient updates</div><div class="value">${state.notificationsEnabled?'On':'Off'}</div><div class="hint">WhatsApp / SMS channel</div></div></div>
<div class="card section"><div class="section-head"><div><div class="section-title">Claim Control Tower</div><div class="small">Visibility + ownership + TAT + next action</div></div><div style="display:flex;gap:6px;align-items:center"><span class="badge">All ${c.length}</span><span class="badge">Queries ${openQueryCount}</span><span class="badge">Hospital actions ${hospitalActions}</span><button class="btn btn-secondary" onclick="monitorClaims()">Monitor</button></div></div>
<table class="table"><thead><tr><th>Patient</th><th>Stage</th><th>Owner</th><th>TAT</th><th>Status</th><th>Action</th></tr></thead><tbody>${c.map(x=>{const pending=x.query&&x.owner!=='TPA'; const actionLabel=pending?'Action pending':x.owner==='TPA'?'Waiting on TPA':'No action'; return `<tr><td><div class="patient-name">${x.patient}</div><div class="small">${x.id} • ${x.payer}</div></td><td><strong>${x.stage}</strong><div class="small">${actionLabel}</div></td><td>${x.owner}</td><td class="mono">${Math.floor(x.elapsed/60)}h ${x.elapsed%60}m / ${Math.floor(x.tatMin/60)}h</td><td>${statusPill(x.health,x.health==='green'?'On track':x.health==='amber'?'Approaching TAT':'Action required')}${pending?'<span class="status-source">Hospital action</span>':''}</td><td><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-secondary" onclick="openClaim('${x.id}')">View</button><button class="btn btn-secondary" onclick="openClaimTab('${x.id}','timeline')">Monitor</button>${x.query&&x.query.status!=='Response Submitted'?`<button class="btn btn-primary" onclick="openClaimTab('${x.id}','query')">${pending?'Resolve':'Manage'}</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>
<div class="grid layout-2" style="margin-top:16px"><div class="card section"><div class="section-head"><div><div class="section-title">Product capabilities</div><div class="small">Three capabilities work together across the discharge journey.</div></div></div><div class="list"><div class="list-row"><div><strong>Claim Readiness</strong><div class="small">Assemble existing records + validate before submission</div></div><span class="badge">Prevent</span></div><div class="list-row"><div><strong>Control Tower</strong><div class="small">Status, owner, reason, TAT, queries and escalation</div></div><span class="badge">Monitor + Act</span></div><div class="list-row"><div><strong>Patient Communication</strong><div class="small">Select a patient to view and manage their updates</div></div><span class="badge">Inform</span></div></div></div><div class="card section"><div class="section-head"><div><div class="section-title">Patient Communication</div><div class="small">Choose a patient to see the customer-facing timeline.</div></div><span class="status green"><span class="dot"></span>${state.notificationsEnabled?'WhatsApp enabled':'Notifications paused'}</span></div><div class="callout blue" style="margin-bottom:12px">Patient communication is managed at the patient level. Internal claim events are translated into patient-safe updates.</div><div class="patient-list">${c.map(x=>`<div class="patient-row" onclick="openPatientCommunication('${x.id}')"><div><div class="patient-name">${x.patient}</div><div class="small">${x.uhid} • ${x.payer}</div></div><div class="state"><span class="small">Current status</span><strong>${x.patientStatus}</strong></div><div><div class="small">Last update</div><div class="last">${x.lastUpdate}</div></div><span class="badge">View →</span></div>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><div class="small">Objective events can notify automatically; sensitive updates require Operations review.</div><div class="switch ${state.notificationsEnabled?'on':''}" onclick="event.stopPropagation();toggleNotifications()"><span></span></div></div></div></div>`}
function monitorClaims(){openDrawer(renderMonitor())}
function renderMonitor(){const c=state.claims;return `<div class="drawer-head"><div><div class="small">INSURANCE / CONTROL TOWER</div><h2 style="margin:5px 0 0">Monitor discharge-critical claims</h2><div class="small" style="margin-top:4px">Prioritise claims that require attention from the Insurance Operations team.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="grid kpis"><div class="card kpi"><div class="label">Total</div><div class="value">${c.length}</div><div class="hint">Active claims</div></div><div class="card kpi"><div class="label">Approaching TAT</div><div class="value">${c.filter(x=>x.health==='amber').length}</div><div class="hint">Follow up soon</div></div><div class="card kpi"><div class="label">TAT breached</div><div class="value">${c.filter(x=>x.health==='red' || x.stage==='Escalated to TPA').length}</div><div class="hint">Escalation required</div></div><div class="card kpi"><div class="label">Hospital actions</div><div class="value">${c.filter(x=>x.query && x.owner!=='TPA').length}</div><div class="hint">Assigned internally</div></div></div><div class="card section" style="margin-top:16px"><div class="section-title">Action visibility</div><div class="list" style="margin-top:10px">${c.map(x=>`<div class="list-row"><div><strong>${x.patient}</strong><div class="small">${x.stage} • owner: ${x.owner}</div></div><div style="text-align:right"><div>${statusPill(x.health,x.health==='green'?'On track':x.health==='amber'?'Approaching TAT':'Action required')}</div><div class="small" style="margin-top:4px">${x.query?'Pending hospital response':'No hospital action required'}</div></div></div>`).join('')}</div></div></div>`}
function openClaimPrep(){state.activeClaim='NEW';state.readinessRun=false;openDrawer(renderClaimPrep())}
function renderClaimPrep(){return `<div class="drawer-head"><div><div class="small">INSURANCE / DISCHARGE CLAIM</div><h2 style="margin:5px 0 0">Prepare Final Claim</h2><div class="small" style="margin-top:4px">Pull the patient's existing EMR + Billing records into one claim package before submission.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="form-grid"><div class="field"><label>Patient ID / UHID</label><input id="uhidInput" value="UHID-10245" /></div><div class="field"><label>Payer / TPA</label><select id="payerSelect"><option>ABC TPA</option><option>XYZ Insurance</option></select></div></div><div style="margin-top:16px"><button class="btn btn-primary" onclick="fetchPatient()">Fetch patient details</button></div><div id="prepArea" class="hidden"></div></div>`}
function fetchPatient(){const p=state.patients[$('#uhidInput').value.trim()];if(!p){$('#prepArea').classList.remove('hidden');$('#prepArea').innerHTML='<div class="callout red" style="margin-top:18px">Patient not found in the demo EMR dataset.</div>';return}state.readinessRun=false;$('#prepArea').classList.remove('hidden');$('#prepArea').innerHTML=`<div style="margin-top:18px" class="card section"><div class="section-head"><div><div class="section-title">${p.name}</div><div class="small">${p.uhid} • ${p.age} yrs • ${p.gender}</div></div><span class="badge">EMR linked</span></div><div class="grid split"><div><div class="small">Clinical record</div><div class="list"><div class="list-row"><span>Diagnosis</span><strong>${p.diagnosis}</strong></div><div class="list-row"><span>Procedure</span><strong>${p.procedure}</strong></div><div class="list-row"><span>Doctor</span><strong>${p.doctor}</strong></div><div class="list-row"><span>Discharge-ready</span><strong>${p.ready}</strong></div></div></div><div><div class="small">Financial record</div><div class="list"><div class="list-row"><span>Preauth</span><strong>${p.preauth}</strong></div><div class="list-row"><span>Final bill</span><strong>${p.finalBill}</strong></div><div class="list-row"><span>Patient payable</span><strong>${p.patientPayable}</strong></div><div class="list-row"><span>Payer</span><strong>${p.payer}</strong></div></div></div></div><div style="margin-top:18px" class="card section"><div class="section-head"><div><div class="section-title">Documents available from existing hospital records</div><div class="small">The Operations Executive reviews these before the claim-readiness check.</div></div><span class="badge">${Object.values(p.documents).filter(Boolean).length}/${Object.keys(p.documents).length} available</span></div><div class="checklist">${Object.entries(p.documents).map(([k,v])=>`<div class="check"><div class="check-main"><div class="icon-box ${v?'icon-ok':'icon-bad'}">${v?'✓':'!'}</div><div><strong>${k}</strong><div class="small">${v?'Available from EMR / Billing / Insurance records':'Missing from the linked record'}</div></div></div><span class="badge">${v?'Available':'Missing'}</span></div>`).join('')}</div></div><div style="margin-top:18px;display:flex;gap:8px"><button class="btn btn-primary" onclick="runReadiness()">Run Claim Readiness Check</button><button class="btn btn-secondary" onclick="openDocumentReview()">Review documents</button></div></div>`}
function runReadiness(){const p=state.patients['UHID-10245'];state.readinessRun=true;const missing=Object.entries(p.documents).filter(([k,v])=>!v).map(x=>x[0]);openDrawer(renderReadiness(p,missing))}
function reviewBtn(type,label,resolved){return resolved?'<button class="btn btn-secondary" disabled>Cleared</button>':'<button class="btn btn-secondary" onclick="openIssueReview(\''+type+'\',\''+label+'\')">Review & Resolve</button>'}
function renderReadiness(p,missing){const unresolved=p.reviewItems.filter(x=>!x.resolved);const missingDocs=Object.entries(p.documents).filter(([k,v])=>!v).map(x=>x[0]);const qualityDocs=Object.keys(p.documentQuality||{});const blocking=missingDocs.length + unresolved.filter(x=>x.blocking).length;const ready=blocking===0;const score=ready?100:Math.max(62,100-(blocking*10));const docRows=Object.entries(p.documents).map(([k,v])=>{const quality=(p.documentQuality||{})[k];const statusClass=!v?'icon-bad':quality?'icon-warn':'icon-ok';const icon=!v?'!':quality?'!':'✓';const label=!v?'Missing':quality?'Review':'Ready';const sub=!v?'Required for this claim type':quality?quality:'Available from existing hospital records';const buttonLabel=!v||quality?'Review & Resolve':'View / Replace';return `<div class="check"><div class="check-main"><div class="icon-box ${statusClass}">${icon}</div><div><strong>${k}</strong><div class="small">${sub}</div></div></div><div class="doc-actions"><span class="badge">${label}</span><button class="btn btn-secondary" onclick="openIssueReview('doc','${k}')">${buttonLabel}</button></div></div>`}).join('');return `<div class="drawer-head"><div><div class="small">CLAIM READINESS</div><h2 style="margin:5px 0 0">${p.name} • ${p.payer}</h2><div class="small" style="margin-top:4px">Pre-submission validation using hospital records + configured payer requirements + AI-assisted review.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="card section"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="small">READINESS</div><div class="score"><div class="n">${score}</div><div class="den">/100</div></div></div><div>${ready?statusPill('green','READY TO SUBMIT'):statusPill('red','NOT READY')}</div></div><div class="progress" style="margin-top:8px"><span style="width:${score}%"></span></div><div class="small" style="margin-top:8px">${ready?'All blocking checks cleared. The Operations Executive can submit the claim.':'Resolve highlighted issues, submit changes for AI-assisted re-check, then run the full claim check again.'}</div></div><div style="margin-top:16px"><div class="section-title">Documents & validation</div><div class="checklist" style="margin-top:10px">${docRows}<div class="issue-row"><div><strong>Billing / authorization consistency</strong><div class="issue-meta"><span class="mini-label">Final bill exceeds preauthorization by ₹32,500</span><span class="mini-label">Needs human review</span></div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge">${p.reviewItems[0].resolved?'Cleared':'Review'}</span>${reviewBtn('billing','Billing / authorization consistency',p.reviewItems[0].resolved)}</div></div><div class="issue-row"><div><strong>Clinical / billing terminology</strong><div class="issue-meta"><span class="mini-label">Procedure wording needs review</span><span class="mini-label">AI-assisted check</span></div></div><div style="display:flex;align-items:center;gap:8px"><span class="badge">${p.reviewItems[1].resolved?'Cleared':'Review'}</span>${reviewBtn('clinical','Clinical / billing terminology',p.reviewItems[1].resolved)}</div></div></div></div><div class="list" style="margin-top:14px"><div class="list-row"><span>Duplicate claim check</span><span class="badge">✓ No duplicate found</span></div><div class="list-row"><span>Payer-specific requirements</span><span class="badge">Configured for ${p.payer}</span></div></div><div class="callout ${ready?'blue':'red'}" style="margin-top:16px">${ready?'<strong>Claim ready.</strong><br/>The readiness engine validates and flags issues; final submission remains with the Insurance Operations Executive.':'<strong>'+blocking+' blocking item(s) remain.</strong><br/>Open each issue, make the necessary correction or attach the document, submit it for AI-assisted re-check, then run the full claim check again.'}</div><div class="sticky-actions"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" onclick="runReadiness()">Run claim check again</button>${ready?'<button class="btn btn-primary" onclick="submitClaim()">Submit final claim</button>':''}<button class="btn btn-secondary" onclick="openDocumentReview()">Review all documents</button></div></div></div>`}
function openClaimPrepFromReadiness(){const p=state.patients['UHID-10245'];openDrawer(renderReadiness(p,Object.entries(p.documents).filter(([k,v])=>!v).map(x=>x[0])))}
function openDocumentReview(){const p=state.patients['UHID-10245'];openDrawer(renderDocumentReview(p))}
function renderDocumentReview(p){return `<div class="drawer-head"><div><div class="small">DOCUMENT REVIEW</div><h2 style="margin:5px 0 0">Review claim package</h2><div class="small" style="margin-top:4px">The Operations Executive can inspect, attach, replace or update records before re-running readiness.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="checklist">${Object.entries(p.documents).map(([k,v])=>`<div class="check"><div class="check-main"><div class="icon-box ${v?'icon-ok':'icon-bad'}">${v?'✓':'!'}</div><div><strong>${k}</strong><div class="small">${v?'Available from the linked hospital record':'Missing / needs update'}</div></div></div><button class="btn ${v?'btn-secondary':'btn-primary'}" onclick="openIssueReview('doc','${k}')">${v?'View / Replace':'Review & Resolve'}</button></div>`).join('')}</div><div style="margin-top:16px" class="callout blue">After a document is corrected or added, submit it for <strong>AI-assisted re-check</strong>, then return to <strong>Claim Readiness</strong> and run the full check again.</div></div>`}
function openIssueReview(type,label){const p=state.patients['UHID-10245'];const docVal=type==='doc'?p.documents[label]:true;let body='';if(type==='doc'){const quality=(p.documentQuality||{})[label];const sample=label==='Discharge Summary'?'DISCHARGE SUMMARY\nPatient: Arun Kumar\nProcedure: Laparoscopic cholecystectomy\nStatus: Signed and available in EMR.':label==='Operative Notes'?'OPERATIVE NOTE\nProcedure: Laparoscopic cholecystectomy\nSurgeon: Dr. Mehta\nStatus: Available in EMR.':`DOCUMENT\n${label}\nLinked hospital record status: ${docVal?'Available':'Missing'}`;body=`<div class="card section"><div class="small">CURRENT RECORD</div><div style="font-size:15px;font-weight:800;margin-top:6px">${docVal?(quality?'Document available — quality issue detected':'Document available'):'Document missing'}</div>${quality?`<div class="issue-warning">⚠ ${quality}</div>`:''}<div class="doc-preview" style="margin-top:10px">${sample}</div></div><div class="section-title" style="margin-top:16px">Resolve document issue</div><div class="doc-actions" style="justify-content:flex-start;margin-top:10px"><button class="btn btn-secondary" onclick="viewDocument('${label}')">View document</button><button class="btn btn-secondary" onclick="attachFromMedicalRecords('${label}')">Attach from Medical Records</button><button class="btn btn-primary" onclick="triggerUpload('${label}')">Upload / replace</button><input id="fileUpload" type="file" style="display:none" accept=".pdf,.jpg,.jpeg,.png" onchange="handleDocumentUpload(event,'${label}')" /></div><div class="small" style="margin-top:8px">Use existing EMR/Medical Records documents where possible. AI validates the submitted change; the Operations Executive remains the decision-maker.</div>`;}else if(type==='billing'){body=`<div class="card section"><div class="small">CURRENT SYSTEM VALUE</div><div style="font-size:15px;font-weight:800;margin-top:6px">Final bill ₹3,82,500 vs preauthorization ₹3,50,000</div><div class="review-compare" style="margin-top:12px"><div><div class="label">Insurance / preauthorization</div><strong>₹3,50,000</strong></div><div><div class="label">Final billing</div><strong>₹3,82,500</strong></div></div></div><div class="field" style="margin-top:16px"><label>Updated information / correction note</label><textarea id="issueEdit">Confirmed additional amount is covered under enhancement and supporting authorization is available.</textarea></div>`;}else{body=`<div class="card section"><div class="small">CROSS-RECORD COMPARISON</div><div class="review-compare" style="margin-top:12px"><div><div class="label">EMR / Operative Note</div><strong>Laparoscopic cholecystectomy</strong></div><div><div class="label">Billing record</div><strong>Procedure wording needs review</strong></div></div></div><div class="field" style="margin-top:16px"><label>Updated information</label><textarea id="issueEdit">Confirmed procedure: Laparoscopic cholecystectomy</textarea></div>`;}openDrawer(`<div class="drawer-head"><div><div class="small">OPERATIONS REVIEW</div><h2 style="margin:5px 0 0">${label}</h2><div class="small" style="margin-top:4px">Review, correct and submit the updated item for AI-assisted re-check.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body">${body}<div class="callout amber" style="margin-top:14px"><strong>Human review required.</strong><br/>The readiness engine identifies issues; the Operations Executive decides what should be corrected, attached or replaced.</div><div class="sticky-actions"><button class="btn btn-primary" onclick="submitIssueForRecheck('${type}','${label}')">Submit change for AI re-check</button><button class="btn btn-secondary" onclick="openClaimPrepFromReadiness()">Back to readiness</button></div></div>`)}
function viewDocument(label){const p=state.patients['UHID-10245'];const content=label==='Discharge Summary'?'DISCHARGE SUMMARY\nPatient: Arun Kumar\nDiagnosis: Acute calculous cholecystitis\nProcedure: Laparoscopic cholecystectomy\nDoctor: Dr. Mehta — General Surgery\nStatus: Signed':`${label.toUpperCase()}\nLinked hospital record\nStatus: ${p.documents[label]?'Available':'Missing'}`;openDrawer(`<div class="drawer-head"><div><div class="small">DOCUMENT VIEWER</div><h2 style="margin:5px 0 0">${label}</h2></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="doc-preview">${content}</div><div class="small" style="margin-top:10px">Read-only preview from the linked hospital record.</div></div>`)}
function attachFromMedicalRecords(label){const p=state.patients['UHID-10245'];p.documents[label]=true;if(p.documentQuality)delete p.documentQuality[label];toast(label+' attached from Medical Records');openIssueReview('doc',label)}
function triggerUpload(label){document.getElementById('fileUpload').click()}
function handleDocumentUpload(event,label){const file=event.target.files&&event.target.files[0];if(!file)return;const p=state.patients['UHID-10245'];p.documents[label]=true;if(p.documentQuality)delete p.documentQuality[label];toast(file.name+' attached as '+label);openIssueReview('doc',label)}
function submitIssueForRecheck(type,label){const p=state.patients['UHID-10245'];const note=(document.getElementById('issueEdit')||{}).value||'Updated item submitted';state.pendingReview={type,label,note};toast('Updated item submitted for AI-assisted re-check');openDrawer(renderRecheckPending(type,label,note))}
function renderRecheckPending(type,label,note){return `<div class="drawer-head"><div><div class="small">AI-ASSISTED RE-CHECK</div><h2 style="margin:5px 0 0">Checking ${label}</h2><div class="small" style="margin-top:4px">The updated item is being validated against the configured claim requirements.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="card section"><div class="callout blue"><strong>Re-check completed</strong><br/>No further blocking issue was detected for this specific item in the demo case.</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="badge">✓ Updated value detected</span><span class="badge">✓ Requirement matched</span><span class="badge">✓ AI-assisted validation passed</span></div><div class="success-note" style="margin-top:14px">This specific issue can now be cleared. The Operations Executive should still run the full claim check before submission.</div></div><div class="sticky-actions"><button class="btn btn-primary" onclick="clearReviewedIssue('${type}','${label}')">Clear this issue & continue</button></div></div>`}
function clearReviewedIssue(type,label){const p=state.patients['UHID-10245'];if(type==='doc'){p.documents[label]=true;if(p.documentQuality)delete p.documentQuality[label];if(label==='Investigation Report')p.reviewItems[0].resolved=true}else if(type==='billing'){p.reviewItems[0].resolved=true}else if(type==='clinical'){p.reviewItems[1].resolved=true}state.pendingReview=null;toast(label+' cleared after AI-assisted re-check');openDrawer(renderReadiness(p,Object.entries(p.documents).filter(([k,v])=>!v).map(x=>x[0])))}
function submitClaim(){const c=state.claims[0];c.stage='TPA / Insurer Review';c.owner='TPA';c.health='green';c.elapsed=32;c.query=null;c.patientStatus='Insurance review in progress';c.lastUpdate='3:35 PM';c.statusSource='System event';c.events.push({time:'3:35 PM',title:'Claim submitted to TPA',actor:'Insurance Operations',source:'System event',note:'Final claim package submitted after readiness check'});toast('Claim submitted to ABC TPA');closeDrawer();setView('insurance');setTimeout(()=>openClaim(c.id),100)}
function openClaim(id){const c=state.claims.find(x=>x.id===id);if(!c)return;state.activeClaim=id;openDrawer(renderClaim(c,'overview'))}
function renderClaim(c,tab='overview'){const p=state.patients[c.uhid];return `<div class="drawer-head"><div><div class="small">${c.id} • ${c.payer}</div><h2 style="margin:5px 0 0">${c.patient}</h2><div class="small" style="margin-top:4px">${c.uhid} • discharge-critical claim</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="tabbar"><button class="tab ${tab==='overview'?'active':''}" onclick="openClaimTab('${c.id}','overview')">Overview</button><button class="tab ${tab==='timeline'?'active':''}" onclick="openClaimTab('${c.id}','timeline')">Timeline</button><button class="tab ${tab==='query'?'active':''}" onclick="openClaimTab('${c.id}','query')">Queries</button></div>${tab==='overview'?claimOverview(c,p):tab==='timeline'?claimTimeline(c):claimQuery(c)}</div>`}
function claimOverview(c,p){const actionNeeded=c.query ? (c.owner==='TPA'?'TPA follow-up / escalation':'Hospital response') : (c.owner==='TPA'&&c.stage!=='Final Authorization'?'Monitor payer review':'No action');const pending=c.query&&c.owner!=='TPA';const postWarn=c.postSubmissionWarning?`<div class="callout amber" style="margin-top:14px"><strong>Post-submission validation warning</strong><br/>${c.postSubmissionWarning}<div style="margin-top:10px"><button class="btn btn-secondary" onclick="openPostSubmissionReview('${c.id}')">Review warning</button></div></div>`:'';return `<div class="grid split"><div class="card section"><div class="small">CURRENT STAGE</div><div style="font-size:18px;font-weight:800;margin-top:6px">${c.stage}</div><div style="margin-top:8px">${statusPill(c.health,c.health==='green'?'On track':c.health==='amber'?'Approaching TAT':'Action required')}</div><div class="small" style="margin-top:8px">Source: ${c.statusSource||'System event'} <span class="status-source">${c.statusSource==='Manual update'?'Verified manual update':'System event'}</span></div></div><div class="card section"><div class="small">CURRENT OWNER</div><div style="font-size:18px;font-weight:800;margin-top:6px">${c.owner}</div><div class="small" style="margin-top:6px">Hospital Insurance Operations controls hospital-side assignment.</div></div></div><div class="grid split" style="margin-top:14px"><div class="card section"><div class="small">TAT</div><div style="font-size:24px;font-weight:900;margin-top:4px">${Math.floor(c.elapsed/60)}h ${c.elapsed%60}m <span class="small">/ ${Math.floor(c.tatMin/60)}h</span></div><div class="progress" style="margin-top:10px"><span style="width:${Math.min(100,c.elapsed/c.tatMin*100)}%"></span></div><div class="small" style="margin-top:8px">${c.elapsed>=c.tatMin?'TAT breached':(c.tatMin-c.elapsed)+' minutes remaining'}</div></div><div class="card section"><div class="small">PATIENT-FACING STATUS</div><div style="font-size:14px;font-weight:800;margin-top:6px">${c.patientStatus}</div><div class="small" style="margin-top:6px">Last updated ${c.lastUpdate}</div></div></div>${postWarn}<div class="card section" style="margin-top:14px"><div class="section-head"><div class="section-title">Operational actions</div>${pending?'<span class="status red"><span class="dot"></span>Action pending</span>':'<span class="status green"><span class="dot"></span>No hospital action pending</span>'}</div><div class="callout ${pending?'amber':'blue'}"><strong>${actionNeeded}</strong><br/>${pending?'An assigned hospital action is pending. Open Queries to update ownership or submit the response.':c.owner==='TPA'?'The next action is with the payer. Update Status is available only for verified payer-side progress.':'The claim is moving through the current stage.'}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn btn-primary" onclick="openStatusUpdate('${c.id}')">Update status</button><button class="btn btn-secondary" onclick="openClaimTab('${c.id}','timeline')">View timeline</button><button class="btn btn-secondary" onclick="openClaimTab('${c.id}','query')">${c.query?'Manage query':'Query status'}</button><button class="btn btn-secondary" onclick="openPatientCommunicationList()">Patient communication</button></div></div><div class="card section" style="margin-top:14px"><div class="section-head"><div class="section-title">Last activity</div><button class="btn btn-link" onclick="openClaimTab('${c.id}','timeline')">View full history</button></div>${(c.events||[]).slice(-3).reverse().map(e=>`<div class="timeline-event"><div class="event-time">${e.time}</div><div class="event-body"><div class="event-title">${e.title}<span class="status-source">${e.source}</span></div><div class="event-meta">${e.actor} • ${e.note||''}</div></div></div>`).join('')}</div>`}
function claimTimeline(c){return `<div class="card section"><div class="section-head"><div><div class="section-title">Claim timeline</div><div class="small">System events and controlled manual updates are both auditable.</div></div><div style="display:flex;gap:8px"><span class="badge">Source tracked</span></div></div><div class="timeline" style="margin-top:14px">${(c.events||[]).map((e,i)=>`<div class="tl ${i<c.events.length-1?'done':'active'}"><h4>${e.title} <span class="status-source">${e.source}</span></h4><p>${e.time} • ${e.actor}<br/>${e.note||''}</p></div>`).join('')}</div></div><div class="card section" style="margin-top:14px"><div class="section-head"><div class="section-title">Current action</div>${c.query&&c.owner!=='TPA'?'<span class="status red"><span class="dot"></span>Hospital action pending</span>':'<span class="status blue"><span class="dot"></span>Owner: '+c.owner+'</span>'}</div><div class="callout ${c.owner==='TPA'?'amber':'blue'}"><strong>${c.owner==='TPA'?'Waiting on payer':'Assigned hospital action'}</strong><br/>${c.owner==='TPA'?'Record verified TPA progress and escalate if the configured TAT is at risk.':'Complete the assigned query action and submit the response back to the Insurance Desk.'}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${c.owner==='TPA'?`<button class="btn btn-danger" onclick="escalateTPA('${c.id}')">Prepare TPA escalation</button>`:''}${c.query?`<button class="btn btn-primary" onclick="openClaimTab('${c.id}','query')">Manage query</button>`:''}</div></div>`}
function claimQuery(c){if(!c.query)return `<div class="card empty"><div style="font-size:24px">✓</div><div style="font-weight:800;color:var(--ink);margin-top:8px">No open query</div><div style="margin-top:5px">${c.owner==='TPA'?'The claim is currently waiting on the payer.':'No query is open for this claim.'}</div><div style="margin-top:14px"><button class="btn btn-secondary" onclick="recordExternalQuery('${c.id}')">+ Record external TPA query</button></div></div>`;const assigned=c.query.assigned||'Unassigned';const hospitalPending=c.owner!=='TPA';return `<div class="card section"><div class="section-head"><div><div class="small">QUERY ${c.query.id||'External'}</div><div class="section-title">${c.query.text}</div><div class="small" style="margin-top:5px">${c.query.source==='External'?'Recorded from external TPA communication':'Captured from TPA workflow'}</div></div>${statusPill(hospitalPending?'red':'amber',hospitalPending?'Action pending':'Waiting on TPA')}</div><div class="callout ${hospitalPending?'amber':'blue'}" style="margin:12px 0"><strong>${hospitalPending?'Something is pending from your side.':'Nothing is pending from the hospital side.'}</strong><br/>${hospitalPending?'The Insurance Operations Executive must own or assign the next hospital action.':'The next action is with the TPA/insurer.'}</div><div class="grid split"><div class="field"><label>Assigned to</label><select id="assignee"><option value="">${assigned==='Unassigned'?'Select hospital owner':'Change owner'}</option><option ${assigned==='Dr. Kumar — Surgery'?'selected':''}>Dr. Kumar — Surgery</option><option ${assigned==='Dr. Mehta — General Surgery'?'selected':''}>Dr. Mehta — General Surgery</option><option ${assigned==='Medical Records Team'?'selected':''}>Medical Records Team</option><option ${assigned==='Billing Team'?'selected':''}>Billing Team</option></select></div><div class="field"><label>Query TAT / Due</label><input value="${c.query.due||'Not set'}" readonly /></div></div><div class="grid split" style="margin-top:12px"><div class="card section"><div class="small">OWNERSHIP</div><strong>${assigned==='Unassigned'?'Unassigned':assigned}</strong><div class="small" style="margin-top:5px">Assigned by Hospital Insurance Operations</div></div><div class="card section"><div class="small">NEXT ACTION</div><strong>${hospitalPending?'Provide / verify response':'Follow up with TPA'}</strong><div class="small" style="margin-top:5px">Status and ownership remain visible across the workflow.</div></div></div><div class="callout blue" style="margin-top:14px"><strong>Manual assignment</strong><br/>The system never auto-assigns hospital staff. The Insurance Operations Executive decides who should act.</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-primary" onclick="saveAssignment('${c.id}')">Save assignment</button>${hospitalPending?`<button class="btn btn-secondary" onclick="submitQueryResponse('${c.id}')">Submit response to TPA</button>`:''}${c.owner==='TPA'?`<button class="btn btn-danger" onclick="escalateTPA('${c.id}')">Prepare TPA escalation</button>`:''}<button class="btn btn-secondary" onclick="recordExternalQuery('${c.id}')">Record another query</button></div></div>`}
function claimPatient(c){return `<div class="card section"><div class="section-head"><div><div class="section-title">Patient communication</div><span class="small">Selected patient • translated from internal workflow states</span></div><span class="status green"><span class="dot"></span>${state.notificationsEnabled?'WhatsApp connected':'Notifications paused'}</span></div><div class="patient-card"><div class="small">WHAT THE PATIENT SEES</div><div style="font-size:18px;font-weight:900;margin-top:6px">${c.patientStatus}</div><div class="small" style="margin-top:6px">Last updated ${c.lastUpdate}</div><div class="whatsapp" style="margin-top:14px"><div class="wa-head">Hospital Insurance Updates</div><div class="wa-body"><div class="wa-bubble"><strong>Insurance Update</strong><br/><span style="display:block;margin-top:6px">${patientMessage(c)}</span><div class="small" style="margin-top:8px">${c.lastUpdate}</div></div></div></div></div><div class="grid split" style="margin-top:16px"><div class="card section"><div class="small">COMMUNICATION RULE</div><strong>${communicationMode(c)}</strong><div class="small" style="margin-top:5px">Objective events can notify automatically; sensitive events require Operations review.</div></div><div class="card section"><div class="small">PATIENT CONTROL</div><strong>${state.notificationsEnabled?'WhatsApp enabled':'Notifications paused'}</strong><div class="small" style="margin-top:5px">Hospital Operations can pause patient communication.</div></div></div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-primary" onclick="openPatientCommunication('${c.id}')">Manage communication</button><button class="btn btn-secondary" onclick="openPatientPreview('${c.id}')">Open patient view</button></div></div>`}
function communicationMode(c){if(c.stage==='Escalated to TPA'||(c.query&&c.owner!=='TPA'))return 'Human review recommended';if(['Final Authorization','Final Authorization Pending','TPA Re-review','Document Verification','TPA / Insurer Review'].includes(c.stage))return 'Automatic on verified event';return 'System suggested update';}
function openPatientPreview(id){const c=state.claims.find(x=>x.id===id);openDrawer(`<div class="drawer-head"><div><div class="small">PATIENT EXPERIENCE</div><h2 style="margin:5px 0 0">${c.patient} • Insurance status</h2><div class="small" style="margin-top:4px">Read-only customer view</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="patient-card"><div class="small">CURRENT STATUS</div><div style="font-size:20px;font-weight:900;margin-top:6px">${c.patientStatus}</div><div class="small" style="margin-top:6px">Last updated ${c.lastUpdate}</div><div class="whatsapp" style="margin-top:16px;max-width:none"><div class="wa-head">Hospital Insurance Updates</div><div class="wa-body"><div class="wa-bubble"><strong>Insurance Update</strong><br/><span style="display:block;margin-top:6px">${patientMessage(c)}</span></div></div></div></div><div class="callout blue" style="margin-top:16px"><strong>Patient should not see internal details.</strong><br/>No internal owner names, query IDs, escalation hierarchy or blame are exposed.</div></div>`)}
function patientMessage(c){if(c.stage==='Escalated to TPA')return 'Your insurance authorization is taking longer than expected. The hospital insurance team is actively following up with the insurer.';if(c.query&&c.owner!=='TPA')return 'The insurer has requested additional information. The hospital team is working on it. No action is required from you unless the hospital contacts you.';if(c.stage==='TPA Re-review')return 'The requested information has been submitted and the insurer has resumed review.';if(c.stage==='Final Authorization' || c.stage==='Final Authorization Pending')return 'Final insurance authorization is in progress. The hospital team is coordinating with the insurer.';if(c.stage==='Document Verification'||c.stage==='TPA / Insurer Review')return 'Your final insurance documents have been submitted and are being reviewed.';return 'Your insurance authorization is being processed. The hospital insurance team is coordinating with the insurer.'}
function renderPatientCommunicationList(){const c=state.claims;return `<div class="drawer-head"><div><div class="small">INSURANCE / PATIENT COMMUNICATION</div><h2 style="margin:5px 0 0">Patient communication</h2><div class="small" style="margin-top:4px">Select a patient to view their insurance communication history and current patient-facing status.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="callout blue">Patient communication is managed at the patient level. Internal claim events are translated into simple, patient-safe updates.</div><div class="patient-list-head" style="margin-top:18px"><span>Patient</span><span>Current status</span><span>Last update</span><span></span></div><div class="patient-list">${c.map(x=>`<div class="patient-row" onclick="openPatientCommunication('${x.id}')"><div><div class="patient-name">${x.patient}</div><div class="small">${x.uhid} • ${x.payer}</div></div><div class="state"><span class="small">Status</span><strong>${x.patientStatus}</strong></div><div><div class="small">Updated</div><div class="last">${x.lastUpdate}</div></div><span class="badge">View history →</span></div>`).join('')}</div></div>`}
function openPatientCommunicationList(){openDrawer(renderPatientCommunicationList())}
function openPatientCommunication(id){const c=state.claims.find(x=>x.id===id);openDrawer(renderPatientCommunication(c))}
function renderPatientCommunication(c){const sent=(c.events||[]).filter(e=>e.source==='Communication').reverse();return `<div class="drawer-head"><div><div class="small">PATIENT COMMUNICATION</div><h2 style="margin:5px 0 0">${c.patient}</h2><div class="small" style="margin-top:4px">${c.uhid} • ${c.payer} • Customer-facing communication</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="comm-detail-grid"><div class="card section"><div class="small">CURRENT PATIENT STATUS</div><div style="font-size:18px;font-weight:900;margin-top:6px">${c.patientStatus}</div><div class="small" style="margin-top:6px">Last updated ${c.lastUpdate}</div></div><div class="card section"><div class="small">CONSENT</div><div style="font-size:15px;font-weight:800;margin-top:6px">${c.communicationConsent!==false?'Communication consent on file':'Consent not confirmed'}</div><div class="small" style="margin-top:6px">HMS remains the source of truth.</div></div></div><div class="comm-preference"><div><div class="small">PREFERRED CHANNEL</div><strong>${c.channel||'WhatsApp'}</strong></div><select onchange="saveCommPreference('${c.id}',this.value)"><option ${c.channel==='WhatsApp'?'selected':''}>WhatsApp</option><option ${c.channel==='SMS'?'selected':''}>SMS</option><option ${c.channel==='Patient Portal'?'selected':''}>Patient Portal</option></select></div><div class="whatsapp" style="max-width:none;margin-top:14px"><div class="wa-head">Hospital Insurance Updates • ${c.channel||'WhatsApp'}</div><div class="wa-body"><div class="wa-bubble"><strong>Patient-safe update</strong><br/><span style="display:block;margin-top:6px">${patientMessage(c)}</span><div class="small" style="margin-top:8px">${c.lastUpdate}</div></div></div></div><div class="grid split" style="margin-top:14px"><div class="card section"><div class="small">COMMUNICATION RULE</div><strong>${communicationMode(c)}</strong><div class="small" style="margin-top:5px">Objective events may notify automatically; sensitive updates require Operations review.</div></div><div class="card section"><div class="small">INTERNAL → PATIENT</div><strong>${c.stage}</strong><div class="small" style="margin-top:5px">Internal owner/details are translated into a patient-safe message.</div></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-primary" onclick="sendPatientUpdate('${c.id}')">Preview & send update</button><button class="btn btn-secondary" onclick="openPatientPreview('${c.id}')">Open patient view</button><button class="btn btn-secondary" onclick="toggleNotifications()">${state.notificationsEnabled?'Pause':'Enable'} notifications</button></div><div class="card section" style="margin-top:14px"><div class="section-title">Notification history</div><div style="margin-top:10px">${sent.length?sent.map(e=>`<div class="history-item"><div class="h-time">${e.time}</div><div class="h-title">${e.title}</div><div class="h-note">${e.note||''}</div></div>`).join(''):'<div class="small" style="margin-top:8px">No patient-specific notifications sent yet.</div>'}</div></div></div>`}
function openClaimTab(id,tab){const c=state.claims.find(x=>x.id===id);openDrawer(renderClaim(c,tab))}
function saveCommPreference(id,value){const c=state.claims.find(x=>x.id===id);c.channel=value;c.lastUpdate='Just now';c.events.push({time:'Just now',title:'Communication preference updated',actor:'Insurance Operations',source:'Communication',note:'Preferred channel set to '+value});toast('Preferred channel updated');openDrawer(renderPatientCommunication(c))}
function recordExternalQuery(id){const c=state.claims.find(x=>x.id===id);openDrawer(`<div class="drawer-head"><div><div class="small">QUERY MANAGEMENT</div><h2 style="margin:5px 0 0">Record external TPA query</h2><div class="small" style="margin-top:4px">Use this when a query is received outside the integrated workflow, such as email or phone.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="form-grid"><div class="field"><label>Source</label><select id="externalSource"><option>Email</option><option>Phone</option><option>WhatsApp</option><option>Other</option></select></div><div class="field"><label>Received time</label><input id="externalTime" value="Just now" /></div></div><div class="field" style="margin-top:12px"><label>Query</label><textarea id="externalText" placeholder="Enter the TPA question or request"></textarea></div><div class="field" style="margin-top:12px"><label>Due / TAT</label><input id="externalDue" value="Within 1 hour" /></div><div class="sticky-actions"><button class="btn btn-primary" onclick="saveExternalQuery('${id}')">Record query</button><button class="btn btn-secondary" onclick="closeDrawer()">Cancel</button></div></div>`)}
function saveExternalQuery(id){const c=state.claims.find(x=>x.id===id);const text=($('#externalText').value||'External TPA clarification request').trim();const source=$('#externalSource').value;c.query={id:'EXT-'+Date.now().toString().slice(-5),text,assigned:null,status:'unassigned',due:$('#externalDue').value,source:'External'};c.owner='Unassigned';c.stage='Query Raised';c.health='red';c.statusSource='Manual update';c.lastUpdate='Just now';c.patientStatus='The insurer has requested additional information. Our hospital team is reviewing the request.';c.events.push({time:'Just now',title:'External query recorded',actor:'Insurance Operations',source:'Manual update',note:source+' • '+text});toast('External TPA query recorded');openDrawer(renderClaim(c,'query'))}
function openPostSubmissionReview(id){const c=state.claims.find(x=>x.id===id);openDrawer(`<div class="drawer-head"><div><div class="small">POST-SUBMISSION REVIEW</div><h2 style="margin:5px 0 0">${c.patient}</h2><div class="small" style="margin-top:4px">Review a validation warning discovered after submission.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="callout amber"><strong>${c.postSubmissionWarning}</strong><br/>This warning does not automatically alter clinical documentation or payer status.</div><div style="margin-top:14px" class="review-compare"><div><div class="label">Submitted claim</div><strong>₹3,50,000 authorized amount</strong></div><div><div class="label">Current billing record</div><strong>₹3,82,500 final bill</strong></div></div><div class="small" style="margin-top:12px">Insurance Operations should review the discrepancy and coordinate with Billing before continuing.</div><div class="sticky-actions"><button class="btn btn-secondary" onclick="openClaimTab('${c.id}','timeline')">View timeline</button><button class="btn btn-primary" onclick="resolvePostSubmissionWarning('${c.id}')">Mark reviewed</button></div></div>`)}
function resolvePostSubmissionWarning(id){const c=state.claims.find(x=>x.id===id);c.postSubmissionWarning=null;c.events.push({time:'Just now',title:'Post-submission warning reviewed',actor:'Insurance Operations',source:'Manual update',note:'Billing / claim discrepancy reviewed'});toast('Post-submission warning marked reviewed');openDrawer(renderClaim(c,'overview'))}
function saveAssignment(id){const c=state.claims.find(x=>x.id===id);const a=$('#assignee').value;if(!a){toast('Select an owner before saving');return}c.owner=a;c.health='amber';c.query.assigned=a;c.query.status='In Progress';c.stage='Query — Hospital Action';c.patientStatus='Additional information is being processed by the hospital';c.lastUpdate='Just now';c.statusSource='Manual update';c.events.push({time:'Just now',title:'Query assigned',actor:'Insurance Operations',source:'Manual update',note:'Assigned to '+a});toast('Assignment saved — owner and TAT are now visible');openDrawer(renderClaim(c,'query'))}
function submitQueryResponse(id){const c=state.claims.find(x=>x.id===id);if(!c.query || !c.query.assigned){toast('Assign the query before submitting a response');return}c.query.status='Response Submitted';c.stage='TPA Re-review';c.owner='TPA';c.health='amber';c.patientStatus='The requested information has been submitted and the insurer has resumed review';c.lastUpdate='Just now';c.statusSource='System event';c.events.push({time:'Just now',title:'Response submitted to TPA',actor:'Insurance Operations',source:'System event',note:'Claim returned to payer review'});toast('Response submitted — claim returned to payer review');openDrawer(renderClaim(c,'timeline'))}
function escalateTPA(id){const c=state.claims.find(x=>x.id===id);c.health='red';c.elapsed=Math.max(c.tatMin+5,c.elapsed);c.stage='Escalated to TPA';c.owner='TPA';c.patientStatus='Insurance authorization is taking longer than expected; the hospital team is following up with the insurer';c.lastUpdate='Just now';c.statusSource='Manual update';c.events.push({time:'Just now',title:'TPA escalation prepared',actor:'Insurance Operations',source:'Manual update',note:'Configured TPA escalation channel'});toast('TPA escalation prepared and logged');openDrawer(renderClaim(c,'timeline'))}
function openStatusUpdate(id){const c=state.claims.find(x=>x.id===id);openDrawer(`<div class="drawer-head"><div><div class="small">CLAIM STATUS</div><h2 style="margin:5px 0 0">Update ${c.id}</h2><div class="small" style="margin-top:4px">Controlled manual update for payer-side states that the HMS cannot observe directly.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="callout blue"><strong>Current status: ${c.stage}</strong><br/>Source: ${c.statusSource||'System event'} • Owner: ${c.owner}</div><div class="field" style="margin-top:16px"><label>New status</label><select id="statusSelect"><option>Awaiting TPA Review</option><option>Medical Verification</option><option>Additional Information Requested</option><option>TPA Internal Processing</option><option>Final Authorization Pending</option><option>TPA Re-review</option></select></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Owner</label><select id="statusOwner"><option>TPA</option><option>Insurance Operations</option></select></div><div class="field"><label>Reason</label><select id="statusReason"><option>Medical verification pending</option><option>Document verification in progress</option><option>Additional review required</option><option>Insurer internal processing</option><option>Final authorization pending</option></select></div></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Expected update</label><input id="expectedUpdate" value="Within 30 minutes" /></div><div class="field"><label>Patient notification</label><select id="patientNotify"><option>Suggested update</option><option>Do not notify</option><option>Preview before sending</option></select></div></div><div class="field" style="margin-top:12px"><label>Source / note</label><textarea id="statusNote" placeholder="e.g. TPA confirmed claim is with medical reviewer">TPA confirmed claim is currently under review.</textarea></div><div class="sticky-actions"><button class="btn btn-primary" onclick="saveStatusUpdate('${c.id}')">Save status update</button><button class="btn btn-secondary" onclick="closeDrawer()">Cancel</button></div></div>`)}
function saveStatusUpdate(id){const c=state.claims.find(x=>x.id===id);const st=$('#statusSelect').value;const owner=$('#statusOwner').value;const reason=$('#statusReason').value;const note=$('#statusNote').value.trim();c.stage=st;c.owner=owner;c.statusSource='Manual update';c.health=(c.elapsed>=c.tatMin?'red':c.tatMin-c.elapsed<30?'amber':'green');c.lastUpdate='Just now';if(st==='Final Authorization Pending')c.patientStatus='Final insurance authorization is in progress';else if(st==='TPA Re-review')c.patientStatus='The requested information has been submitted and the insurer has resumed review';else c.patientStatus='Insurance review is in progress';c.events.push({time:'Just now',title:st,actor:'Insurance Operations',source:'Manual update',note:(reason+' • '+note)});toast('Status updated and audit trail recorded');openDrawer(renderClaim(c,'overview'));}
function sendPatientUpdate(id){const c=state.claims.find(x=>x.id===id);const needsApproval=(c.stage==='Escalated to TPA'||(c.query&&c.owner!=='TPA'));openDrawer(`<div class="drawer-head"><div><div class="small">PATIENT COMMUNICATION</div><h2 style="margin:5px 0 0">Preview update</h2><div class="small" style="margin-top:4px">Review the simplified message before sending.</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body"><div class="whatsapp" style="max-width:none"><div class="wa-head">Hospital Insurance Updates • ${c.channel||'WhatsApp'}</div><div class="wa-body"><div class="wa-bubble"><strong>Insurance Update</strong><br/><span style="display:block;margin-top:6px">${patientMessage(c)}</span><div class="small" style="margin-top:8px">Now</div></div></div></div><div class="callout blue" style="margin-top:14px"><strong>Internal details are hidden.</strong><br/>The patient receives only a clear explanation of what is happening and whether any action is required.</div>${needsApproval?'<div class="callout amber" style="margin-top:12px"><strong>Operations approval required</strong><br/>This is a sensitive update. Review before sending.</div>':''}<div class="sticky-actions"><button class="btn btn-primary" onclick="confirmPatientUpdate('${c.id}')">${needsApproval?'Approve & send':'Send update'}</button><button class="btn btn-secondary" onclick="closeDrawer()">Cancel</button></div></div>`)}
function confirmPatientUpdate(id){const c=state.claims.find(x=>x.id===id);c.lastUpdate='Just now';c.events.push({time:'Just now',title:'Patient update sent',actor:'Insurance Operations',source:'Communication',note:'WhatsApp status update sent to patient/attendant'});toast('Patient-facing update sent');openPatientCommunication(c.id)}
function toggleNotifications(){state.notificationsEnabled=!state.notificationsEnabled;toast(state.notificationsEnabled?'Patient notifications enabled':'Patient notifications paused');render();}
let drawerHistory=[];
function addDrawerBackButton(){const panel=document.getElementById('drawerPanel');const head=panel.querySelector('.drawer-head');if(!head||head.querySelector('.drawer-back'))return;const closeBtn=head.querySelector('.close');const back=document.createElement('button');back.className='drawer-back';back.type='button';back.textContent=drawerHistory.length?'← Back':'← Back to Insurance';back.onclick=drawerBack;if(closeBtn){closeBtn.parentNode.insertBefore(back,closeBtn)}else{head.appendChild(back)}}
function drawerBack(){const panel=document.getElementById('drawerPanel');if(drawerHistory.length){panel.innerHTML=drawerHistory.pop();addDrawerBackButton();document.getElementById('drawer').classList.add('open');return}closeDrawer()}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');state.activeClaim=null;drawerHistory=[]}
function openDrawer(html){const panel=document.getElementById('drawerPanel');if(document.getElementById('drawer').classList.contains('open')&&panel.innerHTML.trim()){drawerHistory.push(panel.innerHTML)}panel.innerHTML=html;addDrawerBackButton();document.getElementById('drawer').classList.add('open')}
$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});document.querySelectorAll('.nav-item').forEach(x=>x.addEventListener('click',()=>setView(x.dataset.view)));
function render(){const v=state.view;$('#content').innerHTML=v==='dashboard'?dashboard():v==='insurance'?insurance():staticView(v)}
render();
</script>
</body>
</html>
